<style>

.text-input{width:100%;height:42px;padding:0 11px;border:1px solid var(--line);border-radius:9px;outline:none;background:#fff}.text-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #0b9c7318}.hidden{display:none!important}.hint{margin:11px 0 0;color:var(--muted);font-size:.77rem;text-align:center;line-height:1.55}.download-area{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.download{width:100%;height:48px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;cursor:pointer;box-shadow:0 10px 22px #087b5d2b}.download:disabled{opacity:.55;cursor:wait}.message{min-height:18px;margin:7px 0 0;font-size:.76rem;color:var(--danger)}

<body><main class="shell">
<header class="top"><div class="brand"><h1>FM 페이스팩 생성기</h1></div><div class="privacy"><span class="dot"></span>사진은 기기 안에서만 처리됩니다</div></header>
<section class="workspace">
<article class="panel editor-panel" id="dropZone">
<div class="panel-head"><h2>사진 편집</h2><span class="badge">드래그로 이동</span></div>
<div class="canvas-wrap"><canvas id="editor" class="editor-canvas" width="260" height="310" aria-label="사진 편집 영역"></canvas></div>
<p class="hint">드래그로 이동 · Shift + 드래그로 수평/수직 이동 · 마우스 휠로 확대 축소</p>
<div class="controls">
<div class="control-block"><span class="label">페이스팩 종류</span><div class="type-tabs"><button class="seg active" data-type="df11">DF11</button><button class="seg" data-type="gunzo">건조</button><button class="seg" data-type="cutout">컷아웃</button></div></div>
<div class="control-block"><span class="label">선수 사진</span><label class="upload">사진 선택<input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp"></label><span class="filename" id="filename">사진 업로드 방법 : 직접 선택, 드래드&드롭, Ctrl+V</span></div>
<div class="control-block"><div class="row"><span class="label">확대 / 축소</span><button class="reset" id="reset">처음 위치</button></div><div class="row"><button class="icon-btn" id="minus" aria-label="축소">−</button><input id="zoom" type="range" min="20" max="300" value="59"><button class="icon-btn" id="plus" aria-label="확대">＋</button><span class="value" id="zoomValue">59%</span></div></div>
<div class="control-block"><div class="switch-row"><span class="label" style="margin:0">필터 미리보기</span><label class="switch"><input id="filterPreview" type="checkbox" checked aria-label="필터 미리보기 켜기 또는 끄기"><span></span></label></div><div class="row" style="margin-top:12px"><span class="subhint" style="margin:0;min-width:46px">선예도</span><input class="texture-slider" data-texture="sharpness" type="range" min="-100" max="100" value="0" title="더블클릭하면 0으로 초기화"><span class="value">0</span></div><div class="row"><span class="subhint" style="margin:0;min-width:46px">선명도</span><input class="texture-slider" data-texture="clarity" type="range" min="-100" max="100" value="0" title="더블클릭하면 0으로 초기화"><span class="value">0</span></div><div class="row"><span class="subhint" style="margin:0;min-width:46px">비네팅</span><input class="texture-slider" data-texture="vignette" type="range" min="0" max="100" value="0" title="더블클릭하면 0으로 초기화"><span class="value">0</span></div><p class="subhint">슬라이더를 더블클릭하면 0으로 돌아갑니다.</p></div>
<div class="control-block"><div class="switch-row"><div><span class="label" style="margin:0">배경 제거</span><p class="subhint">AI 모델 다운로드가 자동으로 진행될 수 있습니다 (약 80MB)</p></div><label class="switch"><input id="removeBg" type="checkbox"><span></span></label></div><p class="status" id="bgStatus"></p></div>
<div class="control-block hidden" id="gunzoOptions"><label class="label" for="playerName">선수 이름</label><input class="text-input" id="playerName" value=""><span class="label" style="margin-top:12px">이름 크기</span><div class="font-tabs"><button class="seg active" data-font="base">기본</button><button class="seg" data-font="long">긴 이름용</button></div></div>
</div></article>
<article class="panel preview-panel"><div class="panel-head"><h2>미리보기</h2><span class="badge" id="sizeBadge">260 × 310 PNG</span></div><div class="canvas-wrap"><canvas id="preview" width="260" height="310" aria-label="최종 결과 미리보기"></canvas></div><div class="download-area"><label class="label" for="playerId">선수 ID</label><input class="text-input" id="playerId" value="" inputmode="numeric"><button class="download" id="download" style="margin-top:10px">PNG 다운로드</button><p class="message" id="message"></p></div></article>
</section></main>
<script type="module">
const editor=document.querySelector('#editor'),preview=document.querySelector('#preview'),ectx=editor.getContext('2d'),pctx=preview.getContext('2d');
const frame=new Image(),mask=new Image(),gunzoFrame=new Image(),filterImages=[new Image(),new Image(),new Image()];
frame.src='assets/frame.png';mask.src='assets/frame-mask.png';gunzoFrame.src='assets/og4.png';['filter2.png','filter3.png','filter4.png'].forEach((src,i)=>filterImages[i].src='assets/'+src);[frame,mask,gunzoFrame,...filterImages].forEach(i=>i.onload=draw);
let player=new Image(),originalFile=null,processedUrl='',type='df11',scale=1,x=0,y=0,sharpness=0,clarity=0,vignette=0,filtersEnabled=true,fontSize='base',dragging=false,anchorX=0,anchorY=0,originX=0,originY=0,axis=null,shiftMode=false,sequence=0,bgBusy=false;
const dims={df11:[260,310],gunzo:[350,350],cutout:[250,250]};
function resize(){const [w,h]=dims[type];editor.width=preview.width=w;editor.height=preview.height=h;document.querySelector('#sizeBadge').textContent=w+' × '+h+' PNG'}
function sharpenCanvas(canvas,amount){if(amount<=0)return;const c=canvas.getContext('2d'),w=canvas.width,h=canvas.height,src=c.getImageData(0,0,w,h),out=c.createImageData(w,h),s=src.data,d=out.data,a=.72*amount;for(let y=0;y<h;y++){for(let x=0;x<w;x++){const i=(y*w+x)*4;if(!s[i+3])continue;const l=(y*w+Math.max(0,x-1))*4,r=(y*w+Math.min(w-1,x+1))*4,u=(Math.max(0,y-1)*w+x)*4,b=(Math.min(h-1,y+1)*w+x)*4;for(let k=0;k<3;k++)d[i+k]=Math.max(0,Math.min(255,s[i+k]*(1+4*a)-a*(s[l+k]+s[r+k]+s[u+k]+s[b+k])));d[i+3]=s[i+3]}}c.putImageData(out,0,0)}
function filteredPhoto(ctx){if(!player.naturalWidth)return;const layer=document.createElement('canvas'),photoMask=document.createElement('canvas');layer.width=photoMask.width=ctx.canvas.width;layer.height=photoMask.height=ctx.canvas.height;const lc=layer.getContext('2d'),mc=photoMask.getContext('2d'),pw=player.naturalWidth*scale,ph=player.naturalHeight*scale;mc.drawImage(player,x,y,pw,ph);const blur=filtersEnabled&&sharpness<0?Math.abs(sharpness)/42:0,contrast=filtersEnabled?Math.max(.65,1+clarity*.0038):1,saturate=filtersEnabled?Math.max(.75,1+clarity*.0014):1,brightness=filtersEnabled&&clarity>0?1+clarity*.00025:1;lc.filter=`blur(${blur}px) contrast(${contrast}) saturate(${saturate}) brightness(${brightness})`;lc.drawImage(player,x,y,pw,ph);lc.filter='none';if(filtersEnabled&&sharpness>0)sharpenCanvas(layer,sharpness/100);if(filtersEnabled&&vignette>0){const fx=document.createElement('canvas');fx.width=layer.width;fx.height=layer.height;const fc=fx.getContext('2d');drawVignette(fc,fx.width,fx.height);fc.globalCompositeOperation='destination-in';fc.drawImage(photoMask,0,0);lc.drawImage(fx,0,0)}lc.globalCompositeOperation='destination-in';lc.drawImage(photoMask,0,0);lc.globalCompositeOperation='source-over';ctx.drawImage(layer,0,0)}
function drawVignette(ctx,w,h){if(vignette<=0)return;const strength=vignette/100,weights=[.34,.27,.2];filterImages.forEach((img,i)=>{if(img.naturalWidth){ctx.save();ctx.globalAlpha=strength*weights[i];ctx.drawImage(img,0,0,w,h);ctx.restore()}});const g=ctx.createRadialGradient(w/2,h*.45,Math.min(w,h)*.25,w/2,h*.48,Math.max(w,h)*.72);g.addColorStop(.5,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${.22*strength})`);ctx.save();ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.restore()}
function composite(ctx,editing=false){const w=ctx.canvas.width,h=ctx.canvas.height;ctx.clearRect(0,0,w,h);ctx.save();
if(type==='df11'){if(frame.naturalWidth)ctx.drawImage(frame,0,0,w,h);const layer=document.createElement('canvas');layer.width=w;layer.height=h;const lc=layer.getContext('2d');filteredPhoto(lc);if(mask.naturalWidth){lc.globalCompositeOperation='destination-in';lc.drawImage(mask,0,0,w,h)}ctx.drawImage(layer,0,0);if(frame.naturalWidth&&mask.naturalWidth){const ov=document.createElement('canvas');ov.width=w;ov.height=h;const oc=ov.getContext('2d');oc.drawImage(frame,0,0,w,h);oc.globalCompositeOperation='destination-out';oc.drawImage(mask,0,0,w,h);ctx.drawImage(ov,0,0)}}
else if(type==='gunzo'){ctx.save();ctx.beginPath();ctx.roundRect(2,2,w-4,h-4,60);ctx.clip();filteredPhoto(ctx);ctx.restore();if(gunzoFrame.naturalWidth)ctx.drawImage(gunzoFrame,0,0,w,h);drawName(ctx,w,h)}
else{filteredPhoto(ctx)}ctx.restore();if(editing){ctx.save();ctx.strokeStyle='#a6abb2';ctx.setLineDash([6,3,1,3]);ctx.beginPath();ctx.moveTo(w/2+.5,8);ctx.lineTo(w/2+.5,h-8);ctx.moveTo(8,h/2+.5);ctx.lineTo(w-8,h/2+.5);ctx.stroke();ctx.restore()}}
function drawName(ctx,w,h){const name=document.querySelector('#playerName').value.trim();if(!name)return;const korean=/[가-힣]/.test(name),px=korean?40:(fontSize==='long'?30:36);ctx.save();ctx.textAlign='center';ctx.font=(korean?'italic ':'')+px+'px '+(korean?'Koverwatch':'BebasNeue');const g=ctx.createLinearGradient(90,0,280,0);[['0','#dfcca2'],['.25','#e4d2ab'],['.55','#d5c091'],['.8','#ead9b5'],['1','#c4a875']].forEach(([s,c])=>g.addColorStop(+s,c));ctx.fillStyle=g;ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.shadowOffsetY=1;ctx.scale(.83,.95);ctx.fillText(name,w*1.21/2,h*.994);ctx.restore()}
function draw(){composite(ectx,true);composite(pctx);zoom.value=Math.round(scale*100);zoomValue.textContent=Math.round(scale*100)+'%'}
function fitImage(){if(!player.naturalWidth)return;const [w,h]=dims[type];scale=Math.max(w/player.naturalWidth,h/player.naturalHeight);x=(w-player.naturalWidth*scale)/2;y=(h-player.naturalHeight*scale)/2;draw()}
function setScaleAt(n,cx,cy){n=Math.max(.2,Math.min(3,n));const r=n/scale;x=cx-(cx-x)*r;y=cy-(cy-y)*r;scale=n;draw()}
function setScale(n){setScaleAt(n,editor.width/2,editor.height/2)}
function message(t,ok=false){const el=document.querySelector('#message');el.style.color=ok?'var(--accent2)':'var(--danger)';el.textContent=t}
function setPhoto(blob,label='붙여넣은 이미지',runBg=true){if(!blob||!/^image\/(png|jpeg|webp)/.test(blob.type)){message('PNG, JPG 또는 WebP 사진을 사용해주세요.');return}if(runBg)originalFile=blob;const n=++sequence,url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{if(n!==sequence){URL.revokeObjectURL(url);return}if(processedUrl)URL.revokeObjectURL(processedUrl);processedUrl=url;player=img;fitImage();message('');if(runBg&&removeBg.checked)doRemoveBg()};img.onerror=()=>{URL.revokeObjectURL(url);message('사진을 읽을 수 없습니다.')};img.src=url}
async function doRemoveBg(){if(!removeBg.checked){if(originalFile)setPhoto(originalFile,originalFile.name||'붙여넣은 이미지',false);bgStatus.textContent='';return}if(!originalFile||bgBusy)return;bgBusy=true;bgStatus.className='status busy';bgStatus.textContent='AI 모델 준비 중…';download.disabled=true;try{const mod=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm'),fn=mod.removeBackground||mod.default;if(typeof fn!=='function')throw Error('모듈을 불러오지 못했습니다.');const result=await fn(originalFile,{output:{format:'image/png',quality:1},progress:(key,current,total)=>{if(total)bgStatus.textContent='배경 제거 처리 중 '+Math.round(current/total*100)+'%'}});setPhoto(result,'배경 제거 이미지',false);bgStatus.textContent='배경 제거 완료';bgStatus.className='status'}catch(err){removeBg.checked=false;bgStatus.textContent='배경 제거 실패: '+(err?.message||'다시 시도해주세요.');bgStatus.className='status error';setPhoto(originalFile,originalFile.name||'원본 이미지',false)}finally{bgBusy=false;download.disabled=false}}
fileInput.onchange=e=>{setPhoto(e.target.files[0]);e.target.value=''};window.addEventListener('paste',e=>{const i=[...e.clipboardData.items].find(v=>v.type.startsWith('image/'));if(i){e.preventDefault();setPhoto(i.getAsFile(),'클립보드 이미지')}});
dropZone.ondragover=e=>{e.preventDefault();dropZone.classList.add('drop-active')};dropZone.ondragleave=()=>dropZone.classList.remove('drop-active');dropZone.ondrop=e=>{e.preventDefault();dropZone.classList.remove('drop-active');setPhoto(e.dataTransfer.files[0])};
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));gunzoOptions.classList.toggle('hidden',type!=='gunzo');resize();fitImage();draw()});document.querySelectorAll('[data-font]').forEach(b=>b.onclick=()=>{fontSize=b.dataset.font;document.querySelectorAll('[data-font]').forEach(x=>x.classList.toggle('active',x===b));draw()});
playerName.oninput=draw;document.querySelectorAll('.texture-slider').forEach(slider=>{slider.oninput=e=>{const value=+e.target.value;if(e.target.dataset.texture==='sharpness')sharpness=value;else if(e.target.dataset.texture==='clarity')clarity=value;else vignette=value;e.target.nextElementSibling.textContent=value;draw()};slider.ondblclick=e=>{e.preventDefault();e.currentTarget.value=0;e.currentTarget.dispatchEvent(new Event('input',{bubbles:true}))}});filterPreview.onchange=e=>{filtersEnabled=e.target.checked;draw()};removeBg.onchange=doRemoveBg;zoom.oninput=e=>setScale(+e.target.value/100);minus.onclick=()=>setScale(scale-.05);plus.onclick=()=>setScale(scale+.05);reset.onclick=fitImage;
editor.addEventListener('wheel',e=>{if(!player.naturalWidth)return;e.preventDefault();const r=editor.getBoundingClientRect(),cx=(e.clientX-r.left)*editor.width/r.width,cy=(e.clientY-r.top)*editor.height/r.height;setScaleAt(scale*(e.deltaY<0?1.08:1/1.08),cx,cy)},{passive:false});
editor.onpointerdown=e=>{if(!player.naturalWidth||e.button!==0)return;dragging=true;editor.classList.add('dragging');editor.setPointerCapture(e.pointerId);anchorX=e.clientX;anchorY=e.clientY;originX=x;originY=y;axis=null;shiftMode=e.shiftKey};editor.onpointermove=e=>{if(!dragging)return;const r=editor.getBoundingClientRect(),dx=(e.clientX-anchorX)*editor.width/r.width,dy=(e.clientY-anchorY)*editor.height/r.height;if(e.shiftKey!==shiftMode){anchorX=e.clientX;anchorY=e.clientY;originX=x;originY=y;axis=null;shiftMode=e.shiftKey;return}if(shiftMode){if(!axis&&Math.max(Math.abs(dx),Math.abs(dy))>2)axis=Math.abs(dx)>=Math.abs(dy)?'x':'y';x=originX+(axis==='x'?dx:0);y=originY+(axis==='y'?dy:0)}else{x=originX+dx;y=originY+dy}draw()};editor.onpointerup=editor.onpointercancel=()=>{dragging=false;editor.classList.remove('dragging')};
download.onclick=()=>{if(!player.naturalWidth)return message('선수 사진을 먼저 업로드해주세요.');const id=playerId.value.trim();if(!id){playerId.focus();return message('선수 ID를 입력해주세요.')}const safe=id.replace(/[\\/:*?"<>|]/g,'_');composite(pctx);const a=document.createElement('a');a.download=safe+'.png';a.href=preview.toDataURL('image/png');a.click();message(safe+'.png 다운로드를 시작했습니다.',true)};resize();draw();
</script></body></html>
